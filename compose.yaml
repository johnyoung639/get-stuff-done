services:
  get-stuff-done:
    build: .
    image: get-stuff-done:local
    container_name: get-stuff-done
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=Europe/London
    ports:
      - "3010:3000" # your reverse proxy (or the tablet) points at this port
    volumes:
      - ./data:/data
    labels:
      # Built locally, so there is nothing for Watchtower to pull
      - com.centurylinklabs.watchtower.enable=false
